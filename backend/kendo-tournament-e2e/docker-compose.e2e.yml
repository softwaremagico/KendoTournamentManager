services:
  database:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: kendo_e2e
      MYSQL_USER: kendo_e2e
      MYSQL_PASSWORD: kendo_e2e_password
      MYSQL_ROOT_PASSWORD: kendo_e2e_root_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pkendo_e2e_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database:/var/lib/mysql

  backend:
    image: eclipse-temurin:25-jre
    depends_on:
      database:
        condition: service_healthy
    command:
      - java
      - -jar
      - /application/kendo-tournament-backend.jar
      - --spring.kendo.datasource.platform=mysql
      - --spring.kendo.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
      - --spring.kendo.datasource.hibernate.dialect=org.hibernate.dialect.MySQLDialect
      - --spring.kendo.datasource.jdbc-url=jdbc:mysql://database:3306/kendo_e2e?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - --spring.kendo.datasource.username=kendo_e2e
      - --spring.kendo.datasource.password=kendo_e2e_password
      - --spring.kendo.datasource.jpa.hibernate.ddl-auto=create-drop
      - --spring.sql.init.mode=never
      - --enable.tenancy=false
      - --bootstrap.super-admin.username=${E2E_USERNAME:-e2e-admin@test.local}
      - --bootstrap.super-admin.password=${E2E_PASSWORD:-E2e-password-123}
      - --bootstrap.super-admin.roles=super_admin,admin,editor,viewer
      - --jwt.ip.check=false
    ports:
      - "18080:8080"
    volumes:
      - ../kendo-tournament-rest/target/kendo-tournament-backend.jar:/application/kendo-tournament-backend.jar:ro

  frontend:
    image: nginx:1.25.5-alpine
    depends_on:
      backend:
        condition: service_started
    command:
      - /bin/sh
      - -ec
      - |
        cp -R /source/. /usr/share/nginx/html/
        cat > /usr/share/nginx/html/config/config.js <<'CONFIG'
        __config = {
          backendUrl: 'http://localhost:18080/kendo-tournament-backend',
          websocketsUrl: 'ws://localhost:18080/kendo-tournament-backend/websockets',
          achievementsEnabled: false,
          checkForNewVersion: false,
        }
        CONFIG
        exec nginx -g 'daemon off;'
    ports:
      - "14200:80"
    volumes:
      - ../../frontend/dist/frontend:/source:ro
      - ./nginx.e2e.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  database:
