# Local, disposable environment for manually trying the application.
#
# Unlike docker-compose.e2e.yml, this file keeps its database between restarts
# and does not recreate the schema on every boot, so data created while testing
# the UI survives `run-app.sh --stop` + `run-app.sh`.
#
# Start it through run-app.sh; it builds the local backend JAR and frontend
# bundle, starts the containers, waits for readiness and prints the URLs.

services:
  database:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: kendo_app
      MYSQL_USER: kendo_app
      MYSQL_PASSWORD: kendo_app_password
      MYSQL_ROOT_PASSWORD: kendo_app_root_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pkendo_app_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database:/var/lib/mysql

  backend:
    image: eclipse-temurin:25-jre
    depends_on:
      database:
        condition: service_healthy
    command:
      - java
      - -jar
      - /application/kendo-tournament-backend.jar
      - --spring.kendo.datasource.platform=mysql
      - --spring.kendo.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
      - --spring.kendo.datasource.hibernate.dialect=com.softwaremagico.kt.persistence.dialect.KendoMySQLDialect
      - --spring.kendo.datasource.jdbc-url=jdbc:mysql://database:3306/kendo_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - --spring.kendo.datasource.username=kendo_app
      - --spring.kendo.datasource.password=kendo_app_password
      - --spring.kendo.datasource.jpa.hibernate.ddl-auto=update
      - --spring.sql.init.mode=never
      - --enable.tenancy=${APP_ENABLE_TENANCY:-true}
      - --bootstrap.super-admin.username=${APP_USERNAME:-admin@test.local}
      - --bootstrap.super-admin.password=${APP_PASSWORD:-Admin-password-123}
      - --bootstrap.super-admin.roles=super_admin,admin,editor,viewer
      - --jwt.ip.check=false
    ports:
      - "${APP_BACKEND_PORT:-18080}:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /kendo-tournament-backend/info/health-check HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    volumes:
      - ../kendo-tournament-rest/target/kendo-tournament-backend.jar:/application/kendo-tournament-backend.jar:ro

  frontend:
    image: nginx:1.25.5-alpine
    depends_on:
      backend:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        cp -R /source/. /usr/share/nginx/html/
        cat > /usr/share/nginx/html/config/config.js <<'CONFIG'
        __config = {
          backendUrl: 'http://localhost:${APP_BACKEND_PORT:-18080}/kendo-tournament-backend',
          websocketsUrl: 'ws://localhost:${APP_BACKEND_PORT:-18080}/kendo-tournament-backend/websockets',
          achievementsEnabled: false,
          checkForNewVersion: false,
        }
        CONFIG
        exec nginx -g 'daemon off;'
    ports:
      - "${APP_FRONTEND_PORT:-14200}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ../../frontend/dist/frontend:/source:ro
      - ./nginx.e2e.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  database:
