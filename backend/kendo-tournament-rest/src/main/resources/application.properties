#Max photo size
spring.servlet.multipart.max-file-size=2MB
spring.application.name=KendoTournament
server.port=8080
server.servlet.context-path=/kendo-tournament-backend
# Do not trust client-supplied X-Forwarded-* headers by default. Only enable a
# forwarded-header strategy when the backend is behind a proxy that sanitises them.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
server.schema=http
server.domain=localhost

springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

#server.domain=my.domain.com
#Comma separated list of allowed CORS origins. Leave empty for same-origin only.
#In production set SERVER_CORS_DOMAINS to the exact frontend origin(s).
server.cors.domains=${SERVER_CORS_DOMAINS:}

spring.messages.basename=language/language

#Database Access
spring.jpa.open-in-view=false
spring.kendo.datasource.jpa.hibernate.ddl-auto=update
spring.kendo.datasource.platform=mysql
spring.kendo.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.kendo.datasource.jdbc-url=jdbc:mysql://127.0.0.1:3306/kendotournament?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.kendo.datasource.username=${DATABASE_USER:user}
spring.kendo.datasource.password=${DATABASE_PASSWORD:}
spring.kendo.datasource.initialize=true
spring.kendo.datasource.test-while-idle=true

spring.kendo.datasource.validation-query=SELECT 1
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
#spring.sql.init.data-locations=optional:classpath*:database/*.sql

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=jcache
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.cache.jcache.config=classpath:ehcache.xml
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE
spring.jpa.properties.hibernate.javax.cache.missing_cache_strategy=create

spring.main.allow-circular-references=true

#Security
#Secrets MUST be supplied through the environment in any non-local deployment.
#database.encryption.key is the master key for all field-level encryption: use a
#long random value (e.g. openssl rand -hex 32) and keep it stable across restarts.
database.encryption.key=${DATABASE_ENCRYPTION_KEY:}
jwt.expiration=1200000
jwt.guest.expiration=14400000
jwt.participant.expiration=317098000000
# Printed registration invitations must remain valid long enough for a tournament season.
jwt.registration.expiration=2592000000
#When empty, a random key is generated on startup (tokens are invalidated on restart).
jwt.secret=${JWT_SECRET:}
jwt.ip.check=true
enable.guest.user=true
enable.participant.access=true
# Multi-organization support. Disable to use a single organization (Default).
enable.tenancy=true
# Set these only for the initial controlled platform bootstrap, then remove them.
bootstrap.super-admin.username=
bootstrap.super-admin.password=
bootstrap.super-admin.roles=super_admin
