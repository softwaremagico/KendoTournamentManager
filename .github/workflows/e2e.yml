name: E2E Browser Tests

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      tests:
        description: 'Optional Surefire filter, for example SwissProgressionTest (empty runs the full suite)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Selenium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_HEADLESS: 'true'
      E2E_KEEP_ENVIRONMENT: 'true'
      E2E_TESTS: ${{ inputs.tests || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check browser and Docker prerequisites
        run: |
          google-chrome --version
          docker compose version
          jq --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run isolated E2E suite
        shell: bash
        run: |
          set -o pipefail
          bash backend/kendo-tournament-e2e/run-e2e.sh 2>&1 | tee e2e-run.log

      - name: Collect Docker logs
        if: always()
        shell: bash
        run: |
          while IFS= read -r project; do
            docker compose --project-name "$project" \
              --file backend/kendo-tournament-e2e/docker-compose.e2e.yml \
              logs --no-color > "$project.log" 2>&1
          done < <(docker compose ls --all --format json | jq -r '.[].Name | select(startswith("kendo-tournament-e2e-"))')

      - name: Remove disposable E2E environment
        if: always()
        run: bash backend/kendo-tournament-e2e/run-e2e.sh --stop

      - name: Upload E2E reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            backend/kendo-tournament-e2e/target/surefire-reports/
            e2e-run.log
            kendo-tournament-e2e-*.log
