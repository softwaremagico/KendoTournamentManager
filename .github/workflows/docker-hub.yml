name: Publish to Docker Hub

# Only trigger, when the build workflow succeeded
on:
  workflow_run:
    workflows: [ "Create Release" ]
    types:
      - completed
  workflow_dispatch:

jobs:
  docker:
    name: Creating Docker Images
    runs-on: ubuntu-22.04
    # I need "packages: write" to access GHCR.
    # More about permissions here: https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
    permissions: write-all
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

#      - name: Set up Docker Buildx
#        uses: docker/setup-buildx-action@v3

      - uses: actions/checkout@v5

#      - name: Build docker-compose
#        run: docker buildx bake --file docker-compose.yml
#        with:
#          projectBaseDir: docker

#      - name: Publish backend docker image
#        uses: docker/bake-action@v6
#        with:
#          source: "{{defaultContext}}:docker"
#          workdir: "docker"
#          push: true
#          set: |
#            *.tags=softwaremagico/kendo-tournament-manager-backend:latest

      - name: Creating backend docker images
        run: |
          cd docker
          set -a
          . ./.env
          set +a
          VERSION=${version}
          docker build -t softwaremagico/kendo-tournament-manager-backend:latest -t softwaremagico/kendo-tournament-manager-backend:${VERSION} \
            --build-arg release=${VERSION} \
            --build-arg machine_domain=${machine_domain} \
            --build-arg protocol=${protocol} \
            --build-arg database_user=${database_user} \
            --build-arg database_name=${database_name} \
            --build-arg database_type=${database_type} \
            --build-arg database_port=${database_port} \
            --build-arg jwt_expiration=${jwt_expiration} \
            --build-arg jwt_guest_expiration=${jwt_guest_expiration} \
            --build-arg jwt_ip_check=${jwt_ip_check} \
            --build-arg timezone=${timezone} \
            --build-arg enable_guest_user=${enable_guest_user} \
            --build-arg database_populate_default_data=${database_populate_default_data} \
            --build-arg enable_tenancy=${enable_tenancy} \
            backend/
          docker push softwaremagico/kendo-tournament-manager-backend:latest
          docker push softwaremagico/kendo-tournament-manager-backend:${VERSION}

      - name: Creating frontend docker images
        run: |
          cd docker
          set -a
          . ./.env
          set +a
          VERSION=${version}
          docker build -t softwaremagico/kendo-tournament-manager-frontend:latest -t softwaremagico/kendo-tournament-manager-frontend:${VERSION} \
            --build-arg release=${VERSION} \
            --build-arg machine_domain=${machine_domain} \
            --build-arg protocol=${protocol} \
            --build-arg websocket_protocol=${websocket_protocol} \
            --build-arg timezone=${timezone} \
            --build-arg achievements_enabled=${achievements_enabled} \
            --build-arg check_new_version_enabled=${check_new_version_enabled} \
            frontend/
          docker push softwaremagico/kendo-tournament-manager-frontend:latest
          docker push softwaremagico/kendo-tournament-manager-frontend:${VERSION}

      - name: Creating rproxy docker images
        run: |
          cd docker
          set -a
          . ./.env
          set +a
          VERSION=${version}
          docker build -t softwaremagico/kendo-tournament-manager-rproxy:latest -t softwaremagico/kendo-tournament-manager-rproxy:${VERSION} \
            --build-arg release=${VERSION} \
            --build-arg email=${email} \
            --build-arg timezone=${timezone} \
            traefik/
          docker push softwaremagico/kendo-tournament-manager-rproxy:latest
          docker push softwaremagico/kendo-tournament-manager-rproxy:${VERSION}
