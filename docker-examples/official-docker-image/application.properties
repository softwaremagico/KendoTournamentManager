server.port=8080
server.schema=https
server.domain=<<machine-domain>>
# Comma-separated exact frontend origins. Empty means same-origin only.
server.cors.domains=${SERVER_CORS_DOMAINS:}
spring.kendo.datasource.platform=mysql
spring.kendo.datasource.hibernate.dialect=com.softwaremagico.kt.persistence.dialect.KendoMySQLDialect
spring.kendo.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.kendo.datasource.jdbc-url=jdbc:mysql://kendo-tournament-database:3306/kendotournament?useSSL=false&autoReconnect=true&allowPublicKeyRetrieval=true
spring.kendo.datasource.username=${DATABASE_USER:myuser}
# No defaults for secrets: the application refuses to start if they are not provided.
spring.kendo.datasource.password=${DATABASE_PASSWORD}
# Use a long random value (openssl rand -hex 32) and keep it stable across restarts.
database.encryption.key=${DATABASE_ENCRYPTION_KEY}
jwt.secret=${JWT_SECRET}
# Forwarded headers are untrusted by default; override only behind a sanitising proxy.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}