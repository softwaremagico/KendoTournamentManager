volumes:
  kendo-tournament-database:
  ssl-certificates:
  logs:
  config:


networks:
  containers:
    internal: true
  external:
    internal: false


services:


  kendo-tournament-frontend:
    build:
      context: ./frontend
      args:
        - release
        - machine_domain
        - protocol
        - timezone
        - websocket_protocol
        - achievements_enabled
        - check_new_version_enabled
    image: kendo-tournament-frontend
    restart: unless-stopped
    networks:
      - containers
      - external
    ports:
      - "4200:4200"
    volumes:
      - /dev/urandom:/dev/random
    container_name: kendo-tournament-frontend
    hostname: kendo-tournament-frontend
    working_dir: /www
    environment:
      - NODE_PATH=/usr/local/lib/node_modules/
    labels:
      - "traefik.enable=true"
      - "traefik.backend=kendo-tournament-frontend"
      - "traefik.http.routers.kendo-tournament-frontend.entrypoints=http"
      - "traefik.http.routers.kendo-tournament-frontend.rule=Host(`${machine_domain}`) && PathPrefix(`/`)"
      - "traefik.docker.network=containers"
      - "traefik.http.services.kendo-tournament-frontend.loadbalancer.server.port=4200"
    healthcheck:
      test: curl --fail --request GET --silent http://localhost:4200 || exit 1
      interval: 30s
      timeout: 30s
      retries: 5
    depends_on:
      - "kendo-tournament-backend"
    logging:
      options:
        max-size: "2m"
        max-file: "5"


  kendo-tournament-backend:
    build:
      context: ./backend
      args:
        - release
        - machine_domain
        - protocol
        - database_user
        - database_name
        - database_type
        - database_port
        - jwt_expiration
        - jwt_guest_expiration
        - jwt_ip_check
        - timezone
        - enable_guest_user
        - database_populate_default_data
        - enable_tenancy
    image: kendo-tournament-backend
    restart: unless-stopped
    networks:
      - containers
      - external
    ports:
      - "8080:8080"
    environment:
      # The frontend is opened directly on port 4200 in this example, so the
      # browser origin differs from the backend origin (:8080).
      - SERVER_CORS_DOMAINS=${SERVER_CORS_DOMAINS:-${protocol}://localhost:4200}
    volumes:
      - /dev/urandom:/dev/random
    container_name: kendo-tournament-backend
    hostname: kendo-tournament-backend
    working_dir: /opt/kendo-tournament-backend/
    # Secrets are runtime environment variables, never build arguments or image layers.
    environment:
      - DATABASE_USER=${database_user}
      - DATABASE_PASSWORD=${database_password:?Set database_password in .env}
      - DATABASE_ENCRYPTION_KEY=${database_encryption_key:?Set database_encryption_key in .env}
      - JWT_SECRET=${jwt_secret:?Set jwt_secret in .env}
      - SERVER_FORWARD_HEADERS_STRATEGY=${SERVER_FORWARD_HEADERS_STRATEGY:-none}
    depends_on:
      - "kendo-tournament-database"
    labels:
      - "traefik.enable=true"
      - "traefik.backend=kendo-tournament-backend"
      - "traefik.http.routers.kendo-tournament-backend.entrypoints=http"
      - "traefik.http.routers.kendo-tournament-backend.rule=Host(`${machine_domain}`) && PathPrefix(`/kendo-tournament-backend`)"

      - "traefik.http.routers.kendo-tournament-backend-api.rule=Host(`${machine_domain}`) && (PathPrefix(`/kendo-tournament-backend/swagger{any:.*}`) || PathPrefix(`/kendo-tournament-backend/v3/api-{any:.*}`))"
      - "traefik.http.routers.kendo-tournament-backend-api.entrypoints=http"
      # Protect swagger with basic auth
      - "traefik.http.routers.kendo-tournament-backend-api.middlewares=auth"
      # Generate a unique htpasswd hash and set TRAEFIK_BASIC_AUTH_USERS in .env.
      # Never reuse a committed credential (e.g. htpasswd -nB admin).
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_BASIC_AUTH_USERS:?Set TRAEFIK_BASIC_AUTH_USERS in .env to an htpasswd hash}"
      - "traefik.docker.network=containers"
      - "traefik.http.services.kendo-tournament-backend.loadbalancer.server.port=8080"
    healthcheck:
      test: curl -k --fail --request GET --silent http://localhost:8080/kendo-tournament-backend/info/health-check || exit 1
      interval: 30s
      timeout: 30s
      retries: 5
    logging:
      options:
        max-size: "2m"
        max-file: "5"


  kendo-tournament-database:
    image: postgres:19.0
    restart: always
    networks:
      - containers
    volumes:
      - kendo-tournament-database:/var/lib/postgresql
    container_name: kendo-tournament-database
    hostname: kendo-tournament-database
    environment:
      - POSTGRES_PASSWORD=${database_password:?Set database_password in .env}
      - POSTGRES_USER=${database_user}
      - POSTGRES_DB=${database_name}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "db_prod" ]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 80s
    logging:
      options:
        max-size: "2m"
        max-file: "5"
