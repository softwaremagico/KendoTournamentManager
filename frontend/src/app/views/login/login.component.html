@if (waiting) {
  <biit-progress-bar [type]="BiitProgressBarType.INDETERMINATE"></biit-progress-bar>
}
@if (!waiting) {
  <mat-form-field class="tenant-selector" *ngIf="showTenantSelector()">
    <mat-label>{{ 'tenantName' | transloco }}</mat-label>
    <input matInput name="tenant" [(ngModel)]="tenant" required>
  </mat-form-field>
  <biit-login id="login"
    [allowResetPassword]="false"
    (onLogin)="login($event)"
    (onResetPassword)="onResetPassword($event)">
  </biit-login>
}
<div class="app-version">
  v{{appVersion}}
</div>
